schema: spec-driven

# 项目上下文（创建工件时向 AI 显示）
context: |
  项目：单位价格比价系统（真实单价 / 规格归一化比价，当前聚焦山姆饮料与微信小程序）。
  创建任何工件前必须读取 docs/architecture.md 与相关 openspec/specs；它们是当前事实源。qa.md 与 openspec/changes/archive 只提供历史背景，不代表现状。

  核心约定：
  - TypeScript pnpm monorepo；Zod 是共享 schema 单一事实源。
  - 三段式解析：tier1 正则（packages/core）→ tier2 AI（仅 apps/api）→ tier3 确定性计算与校验（packages/core）。
  - AI 只结构化理解；价格、换算与可计算终态由确定性程序决定，每个单位价结论带可回放 formula。
  - packages/core 是纯函数、无 IO；当前 miniapp 不运行 core。
  - 中心库只收用户或运营主动提交的数据，不做服务端主动全站爬取。
  - 当前没有独立 comparable/excludedReason；不可计算用空单位价、空 formula 与 warnings 表达。

  Git 工作流约定：
  - OpenSpec 归档等**纯文档变更**（仅改 openspec/ 下的 spec/归档产物，不含任何代码）可**直接提交合并到 main、无需 PR**。
  - 含代码的变更照常走 feature 分支 + PR + review。

# 每个工件的规则
rules:
  proposal:
    - 一个提案只聚焦单个能力。
    - 必须包含「非目标」一节，明确划出本次不做的范围（如不做爬虫、不做复杂促销）。
    - 标注涉及的 workspace 包/应用（packages/core、apps/api 等），以及是否触碰合规敏感面（抓取/众包）。
  specs:
    - 数据结构一律以 Zod schema 描述，types 从中推导；不要在 spec 里手写重复的 TS interface。
    - 凡涉及单价计算的需求，必须写明确定性公式与留痕（formula）要求，以及一致性校验（total == unit*qty*multiplier）。
    - 划清 tier 边界：tier1 正则与 tier3 计算属 packages/core（纯函数无 IO、可同构复用）；tier2 AI 解析仅属 apps/api。
    - AI 只负责结构化理解，禁止把价格、单位换算或可计算终态写成由 LLM 决定。
    - 当前不可计算终态使用空单位价、空 formula 与 warnings；若新增 comparable/excludedReason，必须先更新共享 Zod 契约。
  tasks:
    - 将任务分解为最多 2 小时的块。
    - packages/core 的每个能力任务都要配套单测任务（含脏标题样本集）。
    - 任务标注所属 workspace 路径；core 任务不得包含网络/DB/LLM 等 IO。
  design:
    - 仅在引入新依赖、跨包契约或不可逆决策时才写 design；简单变更跳过。
    - 涉及合规的设计（抓取来源、众包上报）必须对照 docs/architecture.md 的合规边界。
