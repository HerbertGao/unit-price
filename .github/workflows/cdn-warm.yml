name: CDN Warm

# Periodically push the public-read CDN URLs into domestic Aliyun POPs via
# PushObjectCache (domestic-scope domain — an overseas runner curl cannot heat
# it). best-effort: shrinks the cold window after TTL expiry / LRU eviction, does
# NOT guarantee "never cold". cron is non-on-the-hour and 12h apart (the on-hour
# slot is GH's most-dropped); workflow_dispatch is the manual / liveness fallback.
on:
  schedule:
    - cron: '17 8,20 * * *' # 16:17 / 04:17 Asia/Shanghai
  workflow_dispatch: {}

# Only calls an external API; reads no repo content -> no checkout, no scopes.
permissions: {}

# Never cancel an in-flight warm (schedule + dispatch must not abort each other).
concurrency:
  group: cdn-warm
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pin aliyun-cli to a specific version + verify sha256 (NO -latest-). Bump
      # version + sha together from the release's SHASUMS256.txt.
      # version: 3.0.226
      - name: Install aliyun CLI (pinned + sha256-verified)
        run: |
          set -euo pipefail
          ver=3.0.226
          sha=6ef0669b18089f937498d4e39429580d5b94a7145601d8505a08c24762899ae9
          tgz="aliyun-cli-linux-${ver}-amd64.tgz"
          curl -fsSL -o "$tgz" \
            "https://github.com/aliyun/aliyun-cli/releases/download/v${ver}/${tgz}"
          echo "${sha}  ${tgz}" | sha256sum -c -
          tar -xzf "$tgz"
          sudo install -m 0755 aliyun /usr/local/bin/aliyun
          aliyun version

      # Configure AK from secrets. NO set -x, NO echo of the AK. CDN is a center
      # endpoint so the region doesn't affect routing, but the CLI requires a
      # non-empty region to sign the request — a region-less AK-only profile fails
      # with "region can't be empty", so set the CDN center region cn-hangzhou.
      - name: Configure credentials
        env:
          AK_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          AK_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          : "${AK_ID:?missing secret ALIYUN_ACCESS_KEY_ID}"
          : "${AK_SECRET:?missing secret ALIYUN_ACCESS_KEY_SECRET}"
          aliyun configure set --mode AK --access-key-id "$AK_ID" --access-key-secret "$AK_SECRET" --region cn-hangzhou

      # Push each URL independently (per-URL isolation + task-id), one bounded
      # retry per URL to absorb transient throttle/5xx. ObjectPath = full URL incl.
      # query string IS the cache key heated into domestic POPs.
      #
      # Exactly two URLs, and the list is no longer derived from the cohort set:
      # `/rankings` takes no parameters and returns the whole board, so a
      # `?category=` / `?limit=` / `?offset=` variant is a SECOND cache object
      # holding a byte-identical body. Warming those would re-create the 17-key
      # fan-out this endpoint was reshaped to collapse — and each copy is now the
      # full snapshot rather than one page.
      - name: Warm CDN URLs
        run: |
          set -euo pipefail
          BASE="https://unit-price.herbert-dev.cn"

          URLS=(
            "${BASE}/rankings"
            "${BASE}/categories"
          )

          # `timeout 60` bounds EACH push: a hung CLI call → SIGTERM → non-zero →
          # caught by `if !` → retry/fail, so one stall can't block the rest of the
          # loop or burn the whole job timeout (completes per-URL isolation, which
          # otherwise only covers non-zero exits, not hangs).
          fail=0; total=0
          for u in "${URLS[@]}"; do
            total=$((total+1))
            echo "push: $u"
            if ! timeout 60 aliyun cdn PushObjectCache --ObjectPath "$u" \
              --WithHeader '{"Accept-Encoding":[" "]}'; then
              sleep 2
              if ! timeout 60 aliyun cdn PushObjectCache --ObjectPath "$u" \
                --WithHeader '{"Accept-Encoding":[" "]}'; then
                echo "WARN push failed: $u"; fail=$((fail+1)); continue
              fi
            fi
          done
          echo "pushed $((total-fail))/$total"
          # All failed -> red (AK expired / RAM revoked / CLI changed must not go
          # silently green). Partial failure stays green + warns (per-URL self-heal).
          if [ "$fail" -eq "$total" ]; then echo "ALL pushes failed"; exit 1; fi

      # A successful push only proves that Aliyun accepted a task. It does not
      # prove that a cached representation is decodable by WeChat. In particular,
      # a zstd-capable first client once filled the single URL key with zstd and
      # Aliyun served that object even to identity/gzip-only clients.
      - name: Verify CDN content encoding
        run: |
          set -euo pipefail
          BASE="https://unit-price.herbert-dev.cn"

          probe() {
            local url="$1" requested="$2" headers body code actual content_type cache
            headers=$(mktemp); body=$(mktemp)
            if ! code=$(curl -sS --compressed --connect-timeout 10 --max-time 20 \
              -H "Accept-Encoding: ${requested}" -D "$headers" -o "$body" \
              -w '%{http_code}' "$url"); then
              echo "FAIL url=$url requested=$requested curl-error"
              rm -f "$headers" "$body"
              return 1
            fi

            actual=$(awk 'tolower($1)=="content-encoding:" { gsub("\r",""); v=tolower($2) } END { print v }' "$headers")
            content_type=$(awk 'tolower($1)=="content-type:" { gsub("\r",""); v=tolower($2) } END { print v }' "$headers")
            cache=$(awk 'tolower($1)=="x-cache:" { gsub("\r",""); v=$2 " " $3 } END { print v }' "$headers")

            if [ "$code" != 200 ] || [[ "$content_type" != application/json* ]]; then
              echo "FAIL url=$url requested=$requested status=$code type=${content_type:-missing}"
              rm -f "$headers" "$body"
              return 1
            fi
            case "${requested}:${actual}" in
              identity:|identity:identity|gzip:|gzip:identity|gzip:gzip) ;;
              *)
                echo "FAIL url=$url requested=$requested actual=${actual:-identity} cache=${cache:-none}"
                rm -f "$headers" "$body"
                return 1
                ;;
            esac
            if ! python3 -c 'import json,sys; x=json.load(open(sys.argv[1])); keys=("rows","categoryNodes","excluded") if sys.argv[2].endswith("/rankings") else ("nodes",); assert isinstance(x,dict) and all(isinstance(x.get(k),list) for k in keys)' "$body" "$url"; then
              echo "FAIL url=$url requested=$requested invalid-envelope"
              rm -f "$headers" "$body"
              return 1
            fi

            echo "PASS url=$url requested=$requested actual=${actual:-identity} cache=${cache:-none}"
            rm -f "$headers" "$body"
          }

          # PushObjectCache is asynchronous. Retry the complete four-probe set for
          # at most 60s, then fail red instead of accepting a silently bad cache.
          for attempt in {1..6}; do
            failed=0
            for path in rankings categories; do
              for encoding in identity gzip; do
                probe "${BASE}/${path}" "$encoding" || failed=1
              done
            done
            if [ "$failed" -eq 0 ]; then exit 0; fi
            echo "encoding probes not ready attempt=$attempt/6"
            sleep 10
          done
          echo "CDN content-encoding verification failed"
          exit 1
